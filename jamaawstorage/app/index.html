<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/src/assets/logojamaaw.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jamaaw Storage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
  />
  <!-- ESTILOS ANTI-FLASH - Carregam imediatamente -->
  <style>
    /* Previne flash branco durante carregamento */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0D0101; /* void - cor do tema escuro */
      color: #FFFAFA;
      min-height: 100vh;
    }
    /* Garante que o root ocupe espaço */
    #root {
      min-height: 100vh;
      background-color: #0D0101;
    }
    /* Indicador de carregamento enquanto React monta */
    #root:empty::before {
      content: '';
      display: block;
      width: 36px;
      height: 3px;
      margin: 45vh auto;
      background-color: #FF5D00;
      animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
